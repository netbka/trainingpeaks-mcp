name: TEMP strength exercise list verification

on:
  push:
    branches:
      - feat/list-strength-exercises-20260912

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - run: ruff check src/ tests/test_server_strength_exercises.py tests/test_tools/test_strength_exercise_list.py
      - run: mypy src/
      - run: pytest tests/test_server_strength_exercises.py tests/test_tools/test_strength_exercise_list.py -v
      - run: pytest tests/ -q
